<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte des startups — Paris</title>
<meta name="description" content="Découvrez sur une carte interactive de Paris les startups référencées : localisation, secteur d'activité et lien vers chaque site.">

<!-- Polices Snapdesk -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --pink:#E590A1; --sage:#A9BCB7; --ink:#111111;
    --bg:#f4f6f5; --panel:#ffffff; --line:#e7e9e8; --muted:#6b7280;
    --radius:16px; --shadow:0 10px 40px rgba(17,17,17,.16);
    --title:"Josefin Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --body:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--body);color:var(--ink);background:var(--bg)}

  /* ---------- Layout plein écran ---------- */
  .map-app{position:relative;width:100%;height:100vh;min-height:520px;overflow:hidden}
  #map{position:absolute;inset:0;z-index:1;background:#e9edec}

  /* ---------- Barre de recherche ---------- */
  .search{position:absolute;z-index:6;top:18px;left:18px;width:min(360px,calc(100% - 36px))}
  .search-box{display:flex;align-items:center;gap:10px;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
  .search-box svg{flex:none;color:var(--muted)}
  .search-box input{border:0;outline:0;width:100%;font-family:var(--body);font-size:15px;color:var(--ink);background:transparent}
  .search-box input::placeholder{color:var(--muted)}
  .search-clear{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:2px;display:none}
  .search-clear.show{display:block}
  .results{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);overflow:hidden;max-height:min(52vh,420px);overflow-y:auto;display:none}
  .results.show{display:block}
  .result{display:flex;align-items:center;gap:11px;padding:10px 13px;cursor:pointer;border-bottom:1px solid var(--line)}
  .result:last-child{border-bottom:0}
  .result:hover,.result.active{background:#faf5f6}
  .result .r-logo{width:34px;height:34px;border-radius:9px;object-fit:contain;background:#fff;border:1px solid var(--line);flex:none}
  .result .r-txt{min-width:0}
  .result .r-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .result .r-sector{font-size:12px;color:var(--muted)}
  .no-result{padding:14px 15px;color:var(--muted);font-size:14px}

  /* ---------- Marqueurs (logos) ---------- */
  .pin{position:relative;width:46px;height:46px;cursor:pointer}
  .pin .disc{width:46px;height:46px;border-radius:50%;background:#fff;border:3px solid var(--pink);
    box-shadow:0 4px 12px rgba(17,17,17,.22);overflow:hidden;display:flex;align-items:center;justify-content:center;
    transition:transform .12s ease, border-color .12s ease}
  .pin .disc img{width:100%;height:100%;object-fit:contain;padding:5px}
  .pin .disc .initials{font-family:var(--title);font-weight:700;font-size:16px;color:var(--ink)}
  .pin .tip{position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:#fff;border-right:3px solid var(--pink);
    border-bottom:3px solid var(--pink);transform:translateX(-50%) rotate(45deg)}
  .pin:hover .disc, .pin.is-active .disc{transform:scale(1.08);border-color:var(--ink)}
  .pin.is-active .tip{border-color:var(--ink)}

  /* ---------- Panneau de droite ---------- */
  .panel{position:absolute;z-index:7;top:0;right:0;height:100%;width:min(380px,88%);
    background:var(--panel);box-shadow:-14px 0 40px rgba(17,17,17,.18);
    transform:translateX(105%);transition:transform .32s cubic-bezier(.22,.61,.36,1);
    display:flex;flex-direction:column}
  .panel.open{transform:translateX(0)}
  .panel .p-close{position:absolute;top:14px;right:14px;z-index:2;border:0;background:rgba(255,255,255,.85);
    width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:20px;line-height:1;color:var(--ink);
    box-shadow:0 2px 8px rgba(17,17,17,.15)}
  .panel .p-head{padding:34px 26px 22px;background:linear-gradient(180deg,#fbeef1 0%,#fff 100%);border-bottom:1px solid var(--line)}
  .panel .p-logo{width:88px;height:88px;border-radius:20px;background:#fff;border:1px solid var(--line);
    box-shadow:0 6px 18px rgba(17,17,17,.10);object-fit:contain;padding:10px;margin-bottom:16px}
  .panel .p-logo.initials{display:flex;align-items:center;justify-content:center;font-family:var(--title);font-weight:700;font-size:34px}
  .panel .p-name{font-family:var(--title);font-weight:700;font-size:26px;margin:0 0 10px;line-height:1.15}
  .panel .badge{display:inline-flex;align-items:center;gap:7px;background:var(--sage);color:#173430;
    font-weight:600;font-size:13px;padding:6px 12px;border-radius:999px}
  .panel .badge::before{content:"";width:7px;height:7px;border-radius:50%;background:#173430}
  .panel .p-body{padding:22px 26px;overflow-y:auto;flex:1}
  .panel .p-row{margin-bottom:18px}
  .panel .p-row .k{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;margin-bottom:5px}
  .panel .p-row .v{font-size:15px;color:var(--ink)}
  .panel .p-row .v a{color:var(--pink);text-decoration:none;font-weight:600;word-break:break-all}
  .panel .p-row .v a:hover{text-decoration:underline}
  .panel .p-cta{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
    background:var(--ink);color:#fff;text-decoration:none;font-family:var(--title);font-weight:600;font-size:16px;
    padding:15px;border-radius:12px;transition:.15s}
  .panel .p-cta:hover{background:var(--pink);color:var(--ink)}

  /* Compteur discret */
  .count{position:absolute;z-index:5;left:18px;bottom:24px;background:var(--panel);border:1px solid var(--line);
    border-radius:999px;padding:8px 15px;font-size:13px;font-weight:600;color:var(--ink);box-shadow:var(--shadow)}
  .count b{color:var(--pink)}

  /* Message si la clé API manque */
  .apikey-warn{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:28px;background:#e9edec;color:var(--ink)}
  .apikey-warn.show{display:flex}
  .apikey-warn h2{font-family:var(--title);font-size:22px;margin:0 0 10px}
  .apikey-warn p{max-width:460px;color:var(--muted);margin:0 0 6px;font-size:14px;line-height:1.5}
  .apikey-warn code{background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-size:13px}

  /* ---------- Mobile : panneau = feuille du bas ---------- */
  @media (max-width:640px){
    .panel{top:auto;bottom:0;right:0;width:100%;height:min(72%,540px);
      border-radius:22px 22px 0 0;transform:translateY(105%)}
    .panel.open{transform:translateY(0)}
    .panel .p-head{padding-top:26px}
    .count{display:none}
  }
</style>
</head>
<body>

<div class="map-app">
  <div id="map"></div>

  <!-- Recherche -->
  <div class="search">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <input id="q" type="text" placeholder="Rechercher une startup…" autocomplete="off">
      <button class="search-clear" id="qClear" aria-label="Effacer">×</button>
    </div>
    <div class="results" id="results"></div>
  </div>

  <!-- Panneau de détails -->
  <aside class="panel" id="panel" aria-hidden="true">
    <button class="p-close" id="pClose" aria-label="Fermer">×</button>
    <div class="p-head">
      <div id="pLogo"></div>
      <h2 class="p-name" id="pName"></h2>
      <span class="badge" id="pSector"></span>
    </div>
    <div class="p-body">
      <div class="p-row">
        <div class="k">Site web</div>
        <div class="v" id="pLinkRow"></div>
      </div>
      <a class="p-cta" id="pCta" target="_blank" rel="noopener">
        Visiter le site
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"></path><path d="M7 7h10v10"></path></svg>
      </a>
    </div>
  </aside>

  <div class="count" id="count"></div>

  <div class="apikey-warn" id="apiWarn">
    <h2>Clé Google Maps manquante</h2>
    <p>Renseignez votre clé dans <code>index.html</code> : constante <code>GOOGLE_MAPS_API_KEY</code>.</p>
    <p>Obtenez-la sur <b>console.cloud.google.com</b> → activez « Maps JavaScript API » → Identifiants → Créer une clé API.</p>
  </div>
</div>

<script>
/* =====================================================================
   1) CLÉ GOOGLE MAPS  —  À RENSEIGNER
   ---------------------------------------------------------------------
   Créez-la sur https://console.cloud.google.com :
     • activez l'API « Maps JavaScript API »
     • Identifiants → Créer une clé API
     • (recommandé) restreignez la clé à votre domaine
   MAP_ID : laissez "DEMO_MAP_ID" pour tester. Pour la prod, créez un
   « ID de carte » (Map ID) gratuit dans la console → styles personnalisés.
   ===================================================================== */
const GOOGLE_MAPS_API_KEY = "AIzaSyA5e4Pq8XxrnI6BwCwQPw3ZCzPvR9OBF0Y";
const MAP_ID              = "DEMO_MAP_ID";

/* =====================================================================
   2) DONNÉES DES STARTUPS  —  À REMPLACER PAR VOTRE LISTE
   ---------------------------------------------------------------------
     name   : nom affiché
     sector : secteur d'activité (badge)
     url    : lien du site (avec https://)
     logo   : URL d'un logo (png/svg). Laissez "" -> initiales affichées.
     lat,lng: coordonnées GPS. Astuce : clic droit sur Google Maps
              -> les 2 nombres affichés sont "lat, lng".
   ===================================================================== */
const STARTUPS = [
  { name:"Alan",        sector:"Assurance santé",     url:"https://alan.com",
    logo:"https://logo.clearbit.com/alan.com",       lat:48.8709, lng:2.3620 },
  { name:"Doctolib",    sector:"Santé",               url:"https://www.doctolib.fr",
    logo:"https://logo.clearbit.com/doctolib.fr",    lat:48.8918, lng:2.2380 },
  { name:"Qonto",       sector:"Finance",             url:"https://qonto.com",
    logo:"https://logo.clearbit.com/qonto.com",      lat:48.8666, lng:2.3630 },
  { name:"Back Market", sector:"Commerce en ligne",   url:"https://www.backmarket.fr",
    logo:"https://logo.clearbit.com/backmarket.fr",  lat:48.8656, lng:2.3510 },
  { name:"PayFit",      sector:"Ressources humaines", url:"https://payfit.com",
    logo:"https://logo.clearbit.com/payfit.com",     lat:48.8845, lng:2.3210 },
  { name:"Swile",       sector:"Finance / RH",        url:"https://www.swile.co",
    logo:"https://logo.clearbit.com/swile.co",       lat:48.8600, lng:2.3760 },
];

const PARIS = { lat:48.8566, lng:2.3522 };

/* ---------- Utilitaires logo / initiales ---------- */
function initials(name){
  return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function logoNode(s, cls){
  if(s.logo){
    const img = document.createElement('img');
    img.className = cls; img.src = s.logo; img.alt = s.name;
    img.onerror = ()=>{ const d=document.createElement('div'); d.className=cls+' initials'; d.textContent=initials(s.name); img.replaceWith(d); };
    return img;
  }
  const d = document.createElement('div'); d.className = cls+' initials'; d.textContent = initials(s.name);
  return d;
}
function pinNode(s, i){
  const wrap = document.createElement('div');
  wrap.className = 'pin'; wrap.dataset.i = i;
  const disc = document.createElement('div'); disc.className='disc'; disc.appendChild(logoNode(s,''));
  const tip  = document.createElement('div'); tip.className='tip';
  wrap.appendChild(disc); wrap.appendChild(tip);
  return wrap;
}

/* ---------- Chargement de l'API Google Maps ---------- */
function loadGoogleMaps(){
  return new Promise((resolve, reject)=>{
    if(!GOOGLE_MAPS_API_KEY || GOOGLE_MAPS_API_KEY==="VOTRE_CLE_API"){
      document.getElementById('apiWarn').classList.add('show'); reject(new Error('no-key')); return;
    }
    const s = document.createElement('script');
    s.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&v=weekly&libraries=marker&loading=async&callback=__initMap`;
    s.async = true; s.onerror = reject;
    window.__initMap = resolve;
    document.head.appendChild(s);
  });
}

let map, markersByIndex = [];

async function init(){
  try{ await loadGoogleMaps(); }catch(e){ return; }

  const { Map } = await google.maps.importLibrary("maps");
  const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

  map = new Map(document.getElementById('map'), {
    center: PARIS, zoom: 12, mapId: MAP_ID,
    disableDefaultUI: false, mapTypeControl: false, streetViewControl: false,
    fullscreenControl: false, zoomControl: true, clickableIcons: false,
    gestureHandling: "greedy",
  });

  const bounds = new google.maps.LatLngBounds();
  STARTUPS.forEach((s, i)=>{
    const content = pinNode(s, i);
    const marker = new AdvancedMarkerElement({
      map, position:{lat:s.lat, lng:s.lng}, content, title:s.name, gmpClickable:true,
    });
    content.addEventListener('click', ()=> select(i, true));
    marker.addListener('gmp-click', ()=> select(i, true));
    markersByIndex[i] = marker;
    bounds.extend({lat:s.lat, lng:s.lng});
  });
  if(STARTUPS.length){ map.fitBounds(bounds, 90); }

  document.getElementById('count').innerHTML = `<b>${STARTUPS.length}</b> startups référencées`;
}

/* ---------- Panneau de détails ---------- */
const panel  = document.getElementById('panel');

function setActivePin(i){
  document.querySelectorAll('.pin').forEach(p=>p.classList.remove('is-active'));
  if(i>-1){ const el = document.querySelector('.pin[data-i="'+i+'"]'); if(el) el.classList.add('is-active'); }
}
function openPanel(s){
  const holder = document.getElementById('pLogo');
  holder.replaceWith(Object.assign(logoNode(s,'p-logo'),{id:'pLogo'}));
  document.getElementById('pName').textContent   = s.name;
  document.getElementById('pSector').textContent = s.sector || '—';
  const host = s.url.replace(/^https?:\/\//,'').replace(/\/$/,'');
  document.getElementById('pLinkRow').innerHTML  = `<a href="${s.url}" target="_blank" rel="noopener">${host}</a>`;
  document.getElementById('pCta').href           = s.url;
  panel.classList.add('open'); panel.setAttribute('aria-hidden','false');
}
function closePanel(){
  panel.classList.remove('open'); panel.setAttribute('aria-hidden','true');
  setActivePin(-1);
}
document.getElementById('pClose').addEventListener('click', closePanel);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closePanel(); });

/* Sélection d'une startup (marqueur ou recherche) */
function select(i, fromMarker){
  const s = STARTUPS[i];
  setActivePin(i);
  openPanel(s);
  if(map){
    map.panTo({lat:s.lat, lng:s.lng});
    if(map.getZoom() < 14) map.setZoom(15);
    // décale la carte pour que le point ne passe pas sous le panneau (desktop)
    if(window.innerWidth > 640){ setTimeout(()=> map.panBy(170, 0), 60); }
  }
  if(!fromMarker){ closeResults(); document.getElementById('q').value = s.name; toggleClear(); }
}

/* ---------- Recherche ---------- */
const q = document.getElementById('q'), qClear = document.getElementById('qClear'), results = document.getElementById('results');
function toggleClear(){ qClear.classList.toggle('show', q.value.length>0); }
function closeResults(){ results.classList.remove('show'); results.innerHTML=''; }
function searchList(term){
  const t = term.trim().toLowerCase();
  return STARTUPS.map((s,i)=>({s,i})).filter(({s})=> s.name.toLowerCase().includes(t) || (s.sector||'').toLowerCase().includes(t));
}
function renderResults(list){
  if(!q.value.trim()){ closeResults(); return; }
  results.innerHTML = '';
  if(!list.length){ results.innerHTML = `<div class="no-result">Aucune startup trouvée.</div>`; results.classList.add('show'); return; }
  list.forEach(({s,i})=>{
    const row = document.createElement('div'); row.className='result'; row.dataset.i=i;
    row.appendChild(logoNode(s,'r-logo'));
    const txt = document.createElement('div'); txt.className='r-txt';
    txt.innerHTML = `<div class="r-name">${s.name}</div><div class="r-sector">${s.sector||''}</div>`;
    row.appendChild(txt);
    row.addEventListener('click', ()=> select(i, false));
    results.appendChild(row);
  });
  results.classList.add('show');
}
q.addEventListener('input', ()=>{ toggleClear(); renderResults(searchList(q.value)); });
q.addEventListener('focus', ()=>{ if(q.value.trim()) renderResults(searchList(q.value)); });
q.addEventListener('keydown', e=>{ if(e.key==='Enter'){ const f=results.querySelector('.result'); if(f) select(+f.dataset.i, false); }});
qClear.addEventListener('click', ()=>{ q.value=''; toggleClear(); closeResults(); q.focus(); });
document.addEventListener('click', e=>{ if(!e.target.closest('.search')) closeResults(); });

init();
</script>
</body>
</html>
